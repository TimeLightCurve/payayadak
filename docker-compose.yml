version: '3.8'

services:
  payayadak-front-dev:
    image: node:20-alpine
    container_name: payayadak-front-dev
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npx next dev -H 0.0.0.0 -p 3000"
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.payayadak.com}
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true
    networks:
      - payayadak-net
    restart: unless-stopped

  payayadak-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payayadak-front
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.payayadak.com}
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - payayadak-net
    profiles:
      - production

networks:
  payayadak-net:
    external: true
